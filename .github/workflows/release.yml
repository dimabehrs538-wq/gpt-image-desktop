name: 发布 Release（Windows + macOS + Android + iOS）

# 推送 v* 标签时：并行构建 Windows、macOS（Apple Silicon / Intel）、Android（APK + AAB）与 iOS（IPA），
# 汇总全部安装包与桌面端多平台 latest.json，发布到同一个 GitHub Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 v0.1.0，需已存在）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  android:
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  ios:
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit

  release:
    needs: [windows, macos, android, ios]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: GPTImageStudio-*

      - name: 汇总安装包并生成 latest.json
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) -exec cp {} release/ \;
          ls -la release
          python3 - <<'PY'
          import glob, json, os, subprocess, sys, datetime
          tag = os.environ["TAG"]; repo = os.environ["REPO"]
          version = tag.lstrip("v")
          conf = json.load(open("app/src-tauri/tauri.conf.json", encoding="utf-8"))
          if conf["version"] != version:
              sys.exit(f"标签 {tag} 与 tauri.conf.json 版本 {conf['version']} 不一致")
          import re as _re
          pkg = json.load(open("app/package.json", encoding="utf-8"))["version"]
          cargo = _re.search(r'^version = "([^"]+)"', open("app/src-tauri/Cargo.toml", encoding="utf-8").read(), _re.M).group(1)
          if not (pkg == cargo == version):
              sys.exit(f"版本不一致：tag={version} package.json={pkg} Cargo.toml={cargo}")
          base = f"https://github.com/{repo}/releases/download/{tag}"
          def entry(pattern):
              files = [f for f in glob.glob(f"release/{pattern}") if not f.endswith(".sig")]
              if not files or not os.path.exists(files[0] + ".sig"):
                  return None
              f = files[0]
              # GitHub 会把文件名中的空格替换为点，这里产物文件名不含空格
              return {"signature": open(f + ".sig", encoding="utf-8").read().strip(), "url": f"{base}/{os.path.basename(f)}"}
          platforms = {}
          nsis, msi = entry("*-setup.exe"), entry("*.msi")
          mac_arm, mac_x64 = entry("*_aarch64.app.tar.gz"), entry("*_x64.app.tar.gz")
          if nsis:
              platforms["windows-x86_64"] = nsis
              platforms["windows-x86_64-nsis"] = nsis
          if msi:
              platforms["windows-x86_64-msi"] = msi
          if mac_arm:
              platforms["darwin-aarch64"] = mac_arm
              platforms["darwin-aarch64-app"] = mac_arm
          if mac_x64:
              platforms["darwin-x86_64"] = mac_x64
              platforms["darwin-x86_64-app"] = mac_x64
          if not platforms:
              print("未找到 .sig 签名文件（未配置 TAURI_SIGNING_PRIVATE_KEY），跳过 latest.json，仅发布安装包")
              sys.exit(0)
          try:
              notes = subprocess.run(["git", "tag", "-l", "--format=%(contents)", tag], capture_output=True, text=True).stdout.strip()
          except Exception:
              notes = ""
          data = {"version": version, "notes": notes or f"GPTImageStudio {version}",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": platforms}
          json.dump(data, open("release/latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: 校验四端安装包完整性并生成 SHA256SUMS 与发布说明
        env:
          HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          cd release
          # 机密兜底：发布目录中绝不允许出现私钥 / 密钥库 / 本地配置
          if ls | grep -Ei '\.(key|jks|keystore|p12|mobileprovision|properties)$'; then echo "发现疑似机密文件，终止发布"; exit 1; fi
          VERSION="${TAG#v}"
          python3 ../scripts/verify-release.py . --version "$VERSION"
          # APK 签名复核（runner 预装 Android build-tools）
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          for f in *.apk; do "$APKSIGNER" verify --verbose "$f" > "$RUNNER_TEMP/apksigner.txt"; head -n 4 "$RUNNER_TEMP/apksigner.txt"; done
          # 桌面端自动更新：latest.json 必须覆盖三个平台，且每个签名都能被 tauri.conf.json 中的公钥验证
          if [ -f latest.json ]; then
            python3 -c "import cryptography" 2>/dev/null || python3 -m pip install --quiet --break-system-packages cryptography
            python3 ../scripts/verify-updater-sig.py --latest-json latest.json --dir .
            python3 - <<'PY'
          import json, os, sys
          d = json.load(open("latest.json", encoding="utf-8"))
          need = {"windows-x86_64", "darwin-aarch64", "darwin-x86_64"}
          missing = need - set(d["platforms"])
          if missing: sys.exit(f"latest.json 缺少平台：{sorted(missing)}")
          if d["version"] != os.environ["TAG"].lstrip("v"): sys.exit("latest.json 版本与标签不一致")
          for k, v in d["platforms"].items():
              if f"/releases/download/{os.environ['TAG']}/" not in v["url"]: sys.exit(f"{k} 下载地址不指向本次发布：{v['url']}")
          print("latest.json 平台与地址校验通过：", ", ".join(sorted(d["platforms"])))
          PY
          fi
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ "$HAS_ANDROID_KEYSTORE" = "true" ]; then AKS="使用项目固定签名密钥，此后版本可在应用内下载并由系统安装器覆盖升级（保留数据）"; else AKS="本版本使用 CI 临时生成的签名密钥：后续版本签名不同，升级前需先卸载旧版"; fi
          if [ -f latest.json ]; then UPD="已附带 \`latest.json\` 与 \`.sig\` 更新签名（Windows NSIS / macOS .app.tar.gz），已安装的桌面端会在启动后及每 4 小时检查，或在「系统设置 → 软件更新」手动检查。"; else UPD="本次构建 **未配置更新签名私钥**（\`TAURI_SIGNING_PRIVATE_KEY\`），因此 **没有 \`latest.json\` / \`.sig\`，桌面端自动更新暂不可用**，请手动下载新版本覆盖安装。"; fi
          git -C .. fetch -q --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          CHANGES="$(git -C .. tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP/,$d')"
          cat > ../release-notes.md <<EOF2
          ## GPT 生图工作室 ${TAG}

          ${CHANGES}

          调用 OpenAI 兼容 GPT 生图接口（\`/images/generations\`、\`/images/edits\`）的跨平台应用：多分组 baseUrl / apiKey 配置、文生图、多图编辑、本地画廊。

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Windows x64 | \`*_x64-setup.exe\`（推荐）/ \`*_x64_zh-CN.msi\` | 未做 Authenticode 代码签名，SmartScreen 可能提示「未知发布者」，选择「仍要运行」 |
          | macOS Apple Silicon | \`*_aarch64.dmg\` | ad-hoc 签名、未经 Apple 公证：首次打开请右键 → 打开，或执行 \`xattr -cr /Applications/GPTImageStudio.app\` |
          | macOS Intel | \`*_x64.dmg\` | 同上 |
          | Android 7.0+ | \`*_android_universal.apk\` | 通用 APK（arm64-v8a / armeabi-v7a / x86_64），v2/v3 签名，可直接安装；${AKS} |
          | Android（商店包） | \`*_android_universal.aab\` | 供自行上架使用，本项目未发布到任何应用商店 |
          | iOS 15+ | \`*_ios.ipa\` | **未签名**，无法直接安装：需用 AltStore / SideStore / Sideloadly 以自己的 Apple ID 重签后安装（免费账号 7 天有效） |

          **自动更新**：${UPD}

          **测试情况**：Go 单元测试、Rust 移动内核单元测试、前端更新逻辑单元测试、Go / Rust 双内核协议一致性对比与端到端测试、安装包结构校验、更新签名校验均在 CI 中通过；各平台安装包 **尚未在真实设备上完成安装验收**。

          校验和见 \`SHA256SUMS.txt\`。
          EOF2
          sed -i 's/^          //' ../release-notes.md
          cat ../release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: GPTImageStudio ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release/*
