name: 构建 macOS 安装包

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # 由 release.yml 在推送 v* 标签时调用

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin   # Apple Silicon（M 系列）
            goarch: arm64
            label: aarch64
          - target: x86_64-apple-darwin    # Intel
            goarch: amd64
            label: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Go 单元测试
        if: matrix.goarch == 'arm64'
        working-directory: core
        run: go test ./...

      - name: 编译 Go 内核（${{ matrix.target }}）
        run: ./scripts/build-core.sh macos ${{ matrix.goarch }}

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 构建 Tauri 安装包（.app + .dmg）
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY：跳过更新签名，仅生成 .dmg"
            npx tauri build --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.nosign.conf.json
          else
            npx tauri build --target ${{ matrix.target }} --bundles app,dmg
          fi

      - name: 整理产物（按架构重命名更新包，避免同名冲突）
        run: |
          set -euo pipefail
          B=app/src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p dist-mac
          cp "$B"/dmg/*.dmg dist-mac/
          if ls "$B"/macos/*.app.tar.gz >/dev/null 2>&1; then
            for f in "$B"/macos/*.app.tar.gz; do
              n=$(basename "$f" .app.tar.gz)
              cp "$f" "dist-mac/${n}_${{ matrix.label }}.app.tar.gz"
              [ -f "$f.sig" ] && cp "$f.sig" "dist-mac/${n}_${{ matrix.label }}.app.tar.gz.sig"
            done
          fi
          ls -la dist-mac

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: GPTImageStudio-macos-${{ matrix.label }}
          path: dist-mac/*
          if-no-files-found: error
