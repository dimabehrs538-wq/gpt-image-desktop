[package]
name = "gpt-image-studio"
version = "0.1.2"
description = "GPT 生图工作室 - OpenAI 兼容生图接口桌面端"
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = [".", "mobile-core"]

[lib]
name = "gpt_image_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

# 桌面端：Go imagegend sidecar（shell 插件）+ 托盘 + 单实例 + 开机自启 + 自动更新
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# zip 2.x 已全部 yank；Windows NSIS / macOS .app.tar.gz 更新均不需要 zip 特性
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }

# 移动端（Android / iOS）：不能拉起外部子进程，改用进程内纯 Rust 内核（与 Go 内核协议 100% 兼容）
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
imagegen-mobile-core = { path = "mobile-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
